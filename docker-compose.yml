services:
  postgres:
    # Built from postgres/Dockerfile: EDB's own CloudNativePG operand image
    # (docker.enterprisedb.com/k8s/postgresql:18.6-standard-ubi9 — bare
    # Postgres 18, no entrypoint, no aidb/pgfs) plus aidb+pgfs installed from
    # EDB's package repo, plus our own entrypoint script. Needs
    # EDB_SUBSCRIPTION_TOKEN in .env (same token used for `docker login
    # docker.enterprisedb.com`) to build.
    build:
      context: ./postgres
      args:
        PG_BASE_IMAGE: ${PG_BASE_IMAGE:-docker.enterprisedb.com/k8s/postgresql:18.6-standard-ubi9}
        EDB_SUBSCRIPTION_TOKEN: ${EDB_SUBSCRIPTION_TOKEN}
    image: aidb-rag-postgres:latest
    container_name: aidb-rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Host port 5432 was already taken by another local container, so this
      # demo publishes on 5434 instead. Internally, other containers on the
      # compose network still reach it at postgres:5432 (see DATABASE_URL
      # below) — this only affects connecting from your host machine.
      - "5434:5432"
    # No named volume by design (ephemeral) so every ./00-provision.sh starts
    # from the same known-good state, same as this demo's RustFS service.
    restart: unless-stopped

  rustfs:
    # MinIO ceased development (Apr 2026) and pulled its Docker Hub/Quay
    # images; RustFS is the actively-maintained, Apache-2.0 MinIO
    # reimplementation (byte-compatible on-disk format, same S3 API).
    image: rustfs/rustfs:latest
    container_name: aidb-rag-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    image: aidb-rag-webapp:latest
    container_name: aidb-rag-webapp
    depends_on:
      - postgres
      - rustfs
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/demo?sslmode=disable
      # Name of a database that already exists on a fresh instance, used to
      # bootstrap-create the "demo" database above. "postgres" is what
      # postgres/docker-entrypoint.sh's initdb creates by default.
      BOOTSTRAP_DB: postgres
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      # Only takes effect if set in .env — otherwise create_pipelines.py's
      # own defaults apply (see README's "NVIDIA NIM model churn" note).
      NIM_EMBEDDINGS_MODEL: ${NIM_EMBEDDINGS_MODEL:-}
      NIM_COMPLETIONS_MODEL: ${NIM_COMPLETIONS_MODEL:-}
      CATALOGS_BUCKET_URI: s3://aidb-demo-catalogs
      S3_ENDPOINT: http://rustfs:9000
      S3_ALLOW_HTTP: "true"
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_REGION: us-east-1
    ports:
      - "8080:8080"
    restart: unless-stopped
